# render.yaml - Render.com deployment configuration
# Deploy this to Render.com for automatic deployment

services:
  # Backend API Service
  - type: web
    name: getnotify-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn scraper_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false  # Set this in Render dashboard
      - key: SUPABASE_KEY
        sync: false  # Set this in Render dashboard
      - key: SENDGRID_API_KEY
        sync: false  # Set this in Render dashboard (optional, for email notifications)
      - key: PORT
        fromService:
          type: web
          name: getnotify-api
          property: port
    healthCheckPath: /health

  # Frontend Static Site (optional - can also deploy to Vercel/Netlify)
  - type: web
    name: getnotify-frontend
    env: static
    buildCommand: echo "No build needed for static site"
    staticPublishPath: ./frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
