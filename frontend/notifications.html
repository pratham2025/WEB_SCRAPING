     crossorigin="anonymous"></script>
  
  <title>Live Exam Notifications & Updates | CBSE, JEE, NEET, UPSC, RRB – GETNOTIFY</title>
  <meta name="description" content="Stay updated with latest exam notifications and announcements from CBSE, JEE, NEET, NTA, UPSC, GATE, and other major exam boards. Never miss important exam dates, admit cards, results, and updates."/>
  <meta name="keywords" content="live exam notifications, latest exam updates, CBSE notifications, JEE announcements, NEET exam dates, UPSC notifications, RRB recruitment, exam alerts, result notifications, admit card updates" />
  <meta name="author" content="GetNotify" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  
  <!-- Canonical URL -->
  <link rel="canonical" href="https://www.getnotify.in/notifications.html" />
  
  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Live Exam Notifications - GetNotify" />
  <meta property="og:description" content="Real-time exam notifications from CBSE, JEE, NEET, UPSC, RRB and more. Never miss important exam updates." />
  <meta property="og:image" content="https://www.getnotify.in/src/images/favicon/apple-touch-icon.png" />
  <meta property="og:url" content="https://www.getnotify.in/notifications.html" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Live Exam Notifications - GetNotify" />
  <meta name="twitter:description" content="Real-time exam notifications from CBSE, JEE, NEET, UPSC, RRB and more" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="./styles.css"/>
  
  <!-- JSON-LD Structured Data for SEO -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Exam Notifications",
    "description": "Live notifications for exam dates, results, admit cards from CBSE, JEE, NEET, UPSC, RRB",
    "url": "https://www.getnotify.in/notifications.html",
    "publisher": {
      "@type": "Organization",
      "name": "GETNOTIFY",
      "url": "https://www.getnotify.in"
    }
  }
  </script>
</head>
<body>
  <!-- subtle green doodles -->
  <svg class="doodle doodle-1" viewBox="0 0 200 200" aria-hidden="true">
    <path d="M100 10 C140 10 190 40 190 100 C190 160 140 190 100 190 C60 190 10 160 10 100 C10 40 60 10 100 10 Z"
          fill="none" stroke="rgba(0,165,98,0.15)" stroke-width="4"/>
    <circle cx="140" cy="60" r="8" fill="rgba(0,165,98,0.15)"/>
  </svg>
  <svg class="doodle doodle-2" viewBox="0 0 200 200" aria-hidden="true">
    <path d="M20 100 Q100 10 180 100 Q100 190 20 100 Z"
          fill="none" stroke="rgba(0,165,98,0.10)" stroke-width="3" stroke-dasharray="6 8"/>
  </svg>

  <header class="topbar"></header>

  <!-- This container will hold the source cards -->
  <div id="sourceSelector" class="source-selector-container">
      <h1 style="font-size: 2rem; text-align: center; color: var(--ink-900); margin-bottom: 0.5rem;">Live Exam Notifications & Updates</h1>
      <p style="text-align: center; color: var(--ink-600); margin-bottom: 2rem; max-width: 700px; margin-left: auto; margin-right: auto;">Browse real-time announcements from CBSE, JEE, NEET, UPSC, RRB and other major exam boards. Subscribe to get instant email alerts for new updates.</p>
      <h2>Select an Exam Source</h2>
      <div id="sourceCardGrid" class="source-grid">
          <!-- Source cards will be injected here by JS -->
      </div>
  </div>

  <!-- This container holds the original results view and will be hidden initially -->
  <div id="resultsContainer" style="display: none;">
    <nav class="exam-tabs" id="examTabs" aria-label="Sources">
        <!-- JS will now add a 'Back' button and the active source here -->
    </nav>
    <main class="container">
        <div class="status" id="connStatus" aria-live="polite" style="display: none;"></div>

        <section class="results" aria-label="Announcements">
          <div class="results-header">
            <h2><span id="resultCount">0</span> announcements</h2>
          </div>
          <ul id="examList" class="card-list" role="list"></ul>
          <div class="pagination" id="pagination" aria-label="Pagination"></div>
        </section>

        <aside class="details" aria-live="polite" aria-atomic="true">
          <div id="examDetail" class="detail empty">
            <div class="empty-state">
                <svg viewBox="0 0 200 200" class="empty-art" aria-hidden="true">
                    <rect x="20" y="40" width="160" height="100" rx="12" fill="rgba(0,165,98,0.08)"/>
                    <circle cx="50" cy="70" r="10" fill="rgba(0,165,98,0.20)"/>
                    <rect x="70" y="62" width="90" height="8" rx="4" fill="rgba(0,165,98,0.20)"/>
                    <rect x="40" y="90" width="110" height="8" rx="4" fill="rgba(0,165,98,0.12)"/>
                    <rect x="40" y="108" width="80" height="8" rx="4" fill="rgba(0,165,98,0.12)"/>
                </svg>
                <p>Select an announcement to see details</p>
            </div>
          </div>
        </aside>
    </main>
  </div>

  <footer class="footer"></footer>

  <!-- Supabase Auth Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="secrets.js"></script>
  <script src="auth.js"></script>

  <!-- Core site scripts -->
  <script src="./common.js"></script>
  <script src="./app.js"></script>
</body>
</html>
